<div class="container">
  <h2>{{ config.title }}</h2>
  <p class="subtitle" *ngIf="config.subtitle">{{ config.subtitle }}</p>

  <form #arqcForm="ngForm" (ngSubmit)="submitForm(arqcForm)">

    <ng-container *ngFor="let field of fields; let first = first">
    <div class="section-head" *ngIf="field.heading">
      <span>{{ field.heading }}</span>
      <button type="button" class="link-btn" *ngIf="first" (click)="useExampleValues()">Use example values</button>
      <small *ngIf="!first">Pre-filled with typical test values &ndash; change them if your test needs to</small>
    </div>
    <div class="form-group">
      <label [for]="field.id">{{ field.label }} *</label>
      <input type="text" [id]="field.id" [name]="field.key" [(ngModel)]="arqcRequest[field.key]" #ctrl="ngModel" required [pattern]="field.pattern">
      <div class="error" *ngIf="ctrl.invalid && (ctrl.dirty || arqcForm.submitted)">
        <span *ngIf="ctrl.errors?.['required']">This field is required</span>
        <span *ngIf="ctrl.errors?.['pattern']">{{ field.message }}</span>
      </div>
    </div>
    </ng-container>

    <button
      type="submit"
      [disabled]="isSubmitting"
      [class.btn-disabled-look]="arqcForm.invalid || isSubmitting"
    >
      {{ isSubmitting ? 'Calculating...' : 'Submit' }}
    </button>

  </form>

  <div class="response" *ngIf="response || isError">
    <p *ngIf="!isError && response?.result">
      The computed ARQC is: <strong class="crypto-value">{{ response.result }}</strong>
    </p>
    <p *ngIf="isError" class="response-error">
      <strong>Unable to calculate the ARQC</strong><br>
      <small>{{ error_response }}</small>
    </p>
  </div>

</div>
