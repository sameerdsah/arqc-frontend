@if (!open()) {
  <button type="button" class="toggle" (click)="open.set(true)">&#9654; Paste chip data (EMV tags, e.g. field 55)</button>
} @else {
  <div class="panel">
    <div class="head">
      <label for="chipData">Raw chip data (hex)</label>
      <span class="actions">
        @if (example()) {
          <button type="button" class="link-btn" (click)="useExample()">Use example chip data</button>
        }
        <button type="button" class="link-btn" (click)="close()">Close</button>
      </span>
    </div>
    <textarea id="chipData" rows="3" spellcheck="false" autocomplete="off"
              placeholder="e.g. 9F02 06 000000010000 9F37 04 12345678 9F36 02 0001 ..."
              [value]="text()" (input)="setText($any($event.target).value)"></textarea>
    <button type="button" class="read-btn" (click)="read()">Read and fill the form</button>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  </div>
}
