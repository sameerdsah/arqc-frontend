<div class="container">
  <h2>{{ config.title }}</h2>
  <p class="subtitle" *ngIf="config.subtitle">{{ config.subtitle }}</p>

  <app-chip-data-paste [targets]="chipTargets" [example]="exampleChipData" (filled)="applyChipData($event)"></app-chip-data-paste>

  <form #arpcForm="ngForm" (ngSubmit)="submitForm(arpcForm)">

    <app-example-values-link (use)="useExampleValues()"></app-example-values-link>

    <div class="form-group">
      <label for="arqc">Tag 9F26 (ARQC) *</label>
      <input type="text" id="arqc" name="arqc" [(ngModel)]="arpcRequest.arqc" #arqc="ngModel" required pattern="^[0-9A-Fa-f]{16}$">
      <div class="error" *ngIf="arqc.invalid && (arqc.dirty || arpcForm.submitted)">
        <span *ngIf="arqc.errors?.['required']">This field is required</span>
        <span *ngIf="arqc.errors?.['pattern']">Please enter a valid ARQC</span>
      </div>
    </div>
    <div class="form-group">
      <label for="tag8A">Tag 8A (Authorisation Response Code) *</label>
      <input type="text" id="tag8A" name="tag8A" [(ngModel)]="arpcRequest.tag_8a" #tag8A="ngModel" required pattern="^[0-9A-Fa-f]{4}$">
      <div class="error" *ngIf="tag8A.invalid && (tag8A.dirty || arpcForm.submitted)">
        <span *ngIf="tag8A.errors?.['required']">This field is required</span>
        <span *ngIf="tag8A.errors?.['pattern']">Please enter a valid authorisation response code</span>
      </div>
    </div>

    <button
      type="submit"
      [disabled]="isSubmitting"
      [class.btn-disabled-look]="arpcForm.invalid || isSubmitting"
    >
      {{ isSubmitting ? 'Calculating...' : 'Submit' }}
    </button>

  </form>

  <div class="response" *ngIf="response || isError">
    <p *ngIf="!isError && response?.result">
      The computed ARPC is: <strong class="crypto-value">{{ response.result }}</strong>
    </p>
    <p *ngIf="isError" class="response-error">
      <strong>Unable to calculate the ARPC</strong><br>
      <small>{{ error_response }}</small>
    </p>
  </div>

  <app-received-check [path]="config.apiUrl" valueName="ARPC" [calculation]="calculation"
                      [(received)]="received" (apply)="applyChanges($event)"></app-received-check>

</div>
