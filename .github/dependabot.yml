# Dependabot: GitHub opens a pull request when a library or base image has a newer version.
# Security fixes come as soon as they are published (enable "Dependabot security updates" in
# Settings -> Code security). Pull requests do not deploy anything: Jenkins builds main only,
# so an update goes live only after it is merged - and then through the tests and scans.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # All Angular packages move together (one pull request), so versions never mismatch.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      other-dependencies:
        patterns: ["*"]
        exclude-patterns: ["@angular/*", "@angular-devkit/*"]
    ignore:
      # New major versions (Angular, TypeScript, Vitest, jsdom, ...) are planned upgrades, done
      # together with an Angular upgrade - not weekly pull requests. Minor and patch updates and
      # security fixes still come automatically.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Angular supports only specific TypeScript versions (e.g. 6.0.x), so TypeScript moves
      # only when Angular moves.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-minor"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: docker      # node and nginx base images in the Dockerfile
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Node major versions follow the Angular support list and the Jenkins test image (node:24).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
